<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Супер Змійка: Герої Neo</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #0f0c29;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --accent: #00d2ff;
        }

        @keyframes bg-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #090a0f, #1b2735, #24243e, #0f0c29);
            background-size: 400% 400%;
            animation: bg-animation 15s ease infinite;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            overflow: hidden;
            touch-action: none;
        }

        /* Ефект трясіння при програші */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        #menu {
            text-align: center;
            z-index: 10;
            padding: 20px;
            background: rgba(15, 12, 41, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(108, 92, 231, 0.2);
        }

        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 10px;
            background: linear-gradient(to right, #00d2ff, #3a7bd5, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.5));
            animation: glowText 2s infinite alternate;
        }

        @keyframes glowText {
            from { filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.4)); }
            to { filter: drop-shadow(0 0 25px rgba(108, 92, 231, 0.8)); }
        }

        .stats-display {
            background: var(--card-bg);
            padding: 12px 25px;
            border-radius: 50px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .characters {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 350px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
            touch-action: pan-y;
            scroll-behavior: smooth;
        }

        .characters::-webkit-scrollbar { width: 6px; }
        .characters::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 10px; }
        .characters::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--primary), var(--accent));
            border-radius: 10px;
            box-shadow: 0 0 10px var(--primary);
        }

        .char-card {
            background: var(--card-bg);
            border: 2px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .char-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .char-card:hover::before { opacity: 1; }

        .char-card:hover {
            transform: translateY(-5px) scale(1.05);
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
        }

        .char-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
            transition: transform 0.3s;
        }

        .char-card:hover img {
            transform: rotate(5deg) scale(1.1);
        }

        .char-name { margin-top: 10px; font-weight: 600; opacity: 0.9; }

        #game-container {
            display: none;
            position: relative;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: rgba(10, 10, 25, 0.6);
            backdrop-filter: blur(5px);
            border: 4px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(108, 92, 231, 0.4), inset 0 0 20px rgba(0,0,0,0.8);
        }

        .game-ui {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 15px;
            font-size: 1.4rem;
            font-weight: 800;
            text-shadow: 0 0 15px var(--accent);
        }

        @keyframes easterEggPulse {
            0% { transform: scale(1); box-shadow: 0 0 20px #ff0055, inset 0 0 15px #ff0055; }
            50% { transform: scale(1.02); box-shadow: 0 0 40px #ff0055, inset 0 0 25px #ff0055; border-color: #ff0055; }
            100% { transform: scale(1); box-shadow: 0 0 20px #ff0055, inset 0 0 15px #ff0055; }
        }

    </style>
</head>
<body id="main-body">

    <div id="menu">
        <h1>СУПЕР ЗМІЙКА</h1>
        <div class="stats-display">
            🏆 РЕКОРД: <span id="high-score">0</span> | 💀 СМЕРТЕЙ: <span id="death-count">0</span>
        </div>
        
        <div class="characters">
            <!-- Старі герої -->
            <div class="char-card" onclick="startGame('Tito', 'Tito.png', ['#FFD700', '#FFA500'])">
                <img src="Tito.png" alt="Tito">
                <div class="char-name">Тіто</div>
            </div>
            <div class="char-card" onclick="startGame('Smartik', 'Smartik.png', ['#00d2ff', '#3a7bd5'])">
                <img src="Smartik.png" alt="Smartik">
                <div class="char-name">Смартик</div>
            </div>
            <div class="char-card" onclick="startGame('Junior', 'Junior.png', ['#55efc4', '#00b894'])">
                <img src="Junior.png" alt="Junior">
                <div class="char-name">Джуніор</div>
            </div>
            <div class="char-card" onclick="startGame('Fil', 'Fil.png', ['#a29bfe', '#6c5ce7'])">
                <img src="Fil.png" alt="Fil">
                <div class="char-name">Філ</div>
            </div>
            <div class="char-card" onclick="startGame('Milka', 'Milka.png', ['#a29bfe', '#6c5ce7'])">
                <img src="Milka.png" alt="Milka">
                <div class="char-name">Мілка</div>
            </div>
            <div class="char-card" onclick="startGame('Bark', 'Bark.png', ['#a29bfe', '#6c5ce7'])">
                <img src="Bark.png" alt="Bark">
                <div class="char-name">Барк</div>
            </div>

            <!-- Нові 14 героїв -->
            <div class="char-card" onclick="startGame('Persik', 'Persik.png', ['#ffb142', '#ff793f'])">
                <img src="Persik.png" alt="Persik">
                <div class="char-name">Persik</div>
            </div>
            <div class="char-card" onclick="startGame('Spike', 'Spike.png', ['#26de81', '#2bcb71'])">
                <img src="Spike.png" alt="Spike">
                <div class="char-name">Spike</div>
            </div>
            <div class="char-card" onclick="startGame('Alyonka', 'Alyonka.png', ['#ff4757', '#ff6b81'])">
                <img src="Alyonka.png" alt="Alyonka">
                <div class="char-name">Alyonka</div>
            </div>
            <div class="char-card" onclick="startGame('Lilu', 'Lilu.png', ['#fd79a8', '#e84393'])">
                <img src="Lilu.png" alt="Lilu">
                <div class="char-name">Lilu</div>
            </div>
            <div class="char-card" onclick="startGame('Manya', 'Manya.png', ['#ffeaa7', '#fdcb6e'])">
                <img src="Manya.png" alt="Manya">
                <div class="char-name">Manya</div>
            </div>
            <div class="char-card" onclick="startGame('Liza', 'Liza.png', ['#00cec9', '#00b894'])">
                <img src="Liza.png" alt="Liza">
                <div class="char-name">Liza</div>
            </div>
            <div class="char-card" onclick="startGame('Grivna', 'Grivna.png', ['#4cd137', '#44bd32'])">
                <img src="Grivna.png" alt="Grivna">
                <div class="char-name">Grivna</div>
            </div>
            <div class="char-card" onclick="startGame('Ben', 'Ben.png', ['#7158e2', '#3d3d3d'])">
                <img src="Ben.png" alt="Ben">
                <div class="char-name">Ben</div>
            </div>
            <div class="char-card" onclick="startGame('Goldi', 'Goldi.png', ['#eccc68', '#ffa502'])">
                <img src="Goldi.png" alt="Goldi">
                <div class="char-name">Goldi</div>
            </div>
            <div class="char-card" onclick="startGame('Raf', 'Raf.png', ['#70a1ff', '#1e90ff'])">
                <img src="Raf.png" alt="Raf">
                <div class="char-name">Raf</div>
            </div>
            <div class="char-card" onclick="startGame('Veles', 'Veles.png', ['#95afc0', '#57606f'])">
                <img src="Veles.png" alt="Veles">
                <div class="char-name">Veles</div>
            </div>
            <div class="char-card" onclick="startGame('Masha', 'Masha.png', ['#ff9ff3', '#fec107'])">
                <img src="Masha.png" alt="Masha">
                <div class="char-name">Masha</div>
            </div>
            <div class="char-card" onclick="startGame('Brilliantik', 'Brilliantik.png', ['#70a1ff', '#00d2ff'])">
                <img src="Brilliantik.png" alt="Brilliantik">
                <div class="char-name">Brilliantik</div>
            </div>
            <div class="char-card" onclick="startGame('Richik', 'Richik.png', ['#fffa65', '#fff200'])">
                <img src="Richik.png" alt="Richik">
                <div class="char-name">Richik</div>
            </div>

            <!-- Додані герої Шуня і Бакс -->
            <div class="char-card" onclick="startGame('Shunya', 'Shunya.png', ['#fd79a8', '#e84393'])">
                <img src="Shunya.png" alt="Shunya">
                <div class="char-name">Шуня</div>
            </div>
            <div class="char-card" onclick="startGame('Baks', 'Baks.png', ['#2bcb71', '#26de81'])">
                <img src="Baks.png" alt="Baks">
                <div class="char-name">Бакс</div>
            </div>

            <!-- ПАСХАЛКА -->
            <div style="grid-column: 1 / -1; height: 3500px;"></div>
            <div class="char-card" onclick="window.location.href='https://platon-lab.github.io/Verity/'" style="grid-column: 1 / -1; border: 2px solid #ff0055; animation: easterEggPulse 2s infinite; background: rgba(255, 0, 85, 0.1);">
                <img src="Verity.png" alt="Verity" style="width: 90px; height: 90px; filter: drop-shadow(0 0 15px #ff0055);">
                <div class="char-name" style="color: #ff0055; text-shadow: 0 0 10px #ff0055; font-size: 1.2rem; font-weight: 800;">Verity</div>
            </div>
            <div style="grid-column: 1 / -1; height: 50px;"></div>
        </div>
    </div>

    <div id="game-container">
        <div class="game-ui">
            <span>SCORE: <span id="current-score" style="color: var(--accent);">0</span></span>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <audio id="gameOverSound" src="GAME OVER.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const gameContainer = document.getElementById('game-container');
        const body = document.getElementById('main-body');
        const gameOverSound = document.getElementById('gameOverSound');

        const gridSize = 20;
        let tileCount, snake, food, dx, dy, score, currentColors, headImg = new Image();
        let particles = [];
        let gameSpeed = 150;
        let gameLoop;

        let highScore = localStorage.getItem('snake_highScore') || 0;
        let deaths = localStorage.getItem('snake_deaths') || 0;

        function updateStatsDisplay() {
            document.getElementById('high-score').innerText = highScore;
            document.getElementById('death-count').innerText = deaths;
        }
        updateStatsDisplay();

        function startGame(name, imgSrc, colors) {
            headImg.src = imgSrc;
            currentColors = colors;
            
            const size = Math.min(window.innerWidth - 40, 400);
            canvas.width = canvas.height = Math.floor(size / gridSize) * gridSize;
            tileCount = canvas.width / gridSize;

            menu.style.display = 'none';
            gameContainer.style.display = 'flex';
            
            resetGame();
            runGame();
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 0; dy = 0; score = 0; gameSpeed = 150;
            particles = [];
            document.getElementById('current-score').innerText = score;
            spawnFood();
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            if (snake.some(p => p.x === food.x && p.y === food.y)) spawnFood();
        }

        // Клас для частинок (ефект вибуху їжі)
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.color = color;
                this.size = Math.random() * 4 + 1.5;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.01;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                this.alpha -= this.decay;
                this.size *= 0.95;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function runGame() {
            if (didGameEnd()) {
                gameOverSound.play().catch(() => {});
                body.classList.add('shake');
                setTimeout(() => body.classList.remove('shake'), 400);

                deaths++;
                localStorage.setItem('snake_deaths', deaths);
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snake_highScore', highScore);
                }
                updateStatsDisplay();
                
                setTimeout(() => {
                    alert("GAME OVER! Твій рахунок: " + score);
                    menu.style.display = 'block';
                    gameContainer.style.display = 'none';
                }, 100);
                return;
            }

            clearTimeout(gameLoop);
            gameLoop = setTimeout(() => {
                update();
                draw();
                runGame();
            }, gameSpeed);
        }

        function update() {
            if (dx === 0 && dy === 0) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('current-score').innerText = score;
                gameSpeed = Math.max(70, 150 - Math.floor(score/20) * 5);
                
                // Створюємо більше яскравих частинок
                for(let i=0; i<25; i++) {
                    particles.push(new Particle(
                        food.x * gridSize + gridSize/2, 
                        food.y * gridSize + gridSize/2, 
                        (i % 2 === 0) ? "#ffffff" : currentColors[0]
                    ));
                }
                spawnFood();
            } else {
                snake.pop();
            }

            particles.forEach((p, i) => {
                p.update();
                if (p.alpha <= 0) particles.splice(i, 1);
            });
        }

        function draw() {
            // Фон з легким шлейфом
            ctx.fillStyle = "rgba(10, 10, 25, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Сітка з неоновим відтінком
            ctx.strokeStyle = "rgba(108, 92, 231, 0.08)";
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Пульсуюча їжа
            let time = Date.now() / 150;
            let pulseSize = Math.sin(time) * 2;
            
            ctx.shadowBlur = 15 + pulseSize * 3;
            ctx.shadowColor = "#ff4757";
            ctx.fillStyle = "#ff4757";
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, (gridSize/2.5) + pulseSize/4, 0, Math.PI * 2);
            ctx.fill();
            
            // Відблиск на їжі
            ctx.fillStyle = "#ffffff";
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2 - 2, food.y * gridSize + gridSize/2 - 2, gridSize/6, 0, Math.PI * 2);
            ctx.fill();

            // Частинки
            particles.forEach(p => p.draw());

            // Змійка з градієнтом і тінню
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = currentColors[0];
                    ctx.drawImage(headImg, part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = currentColors[index % currentColors.length];
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = currentColors[0];
                    ctx.beginPath();
                    // Робимо хвіст трохи меншим до кінця
                    let sizeOffset = Math.min(6, index * 0.15);
                    ctx.roundRect(part.x * gridSize + 2 + sizeOffset/2, part.y * gridSize + 2 + sizeOffset/2, gridSize - 4 - sizeOffset, gridSize - 4 - sizeOffset, 6);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
        }

        function didGameEnd() {
            if (dx === 0 && dy === 0) return false;
            const head = snake[0];
            const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
            const hitSelf = snake.slice(1).some(p => p.x === head.x && p.y === head.y);
            return hitWall || hitSelf;
        }

        // Керування
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; }
            if (e.key === 'ArrowUp' && dy !== 1) { dx = 0; dy = -1; }
            if (e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; }
            if (e.key === 'ArrowDown' && dy !== -1) { dx = 0; dy = 1; }
        });

        let tsX, tsY;
        document.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }, {passive: true});
        document.addEventListener('touchend', e => {
            if (e.target.closest('.characters')) return;

            const dx_ = e.changedTouches[0].clientX - tsX;
            const dy_ = e.changedTouches[0].clientY - tsY;
            if (Math.abs(dx_) > Math.abs(dy_)) {
                if (dx_ > 30 && dx !== -1) { dx = 1; dy = 0; } else if (dx_ < -30 && dx !== 1) { dx = -1; dy = 0; }
            } else {
                if (dy_ > 30 && dy !== -1) { dx = 0; dy = 1; } else if (dy_ < -30 && dx !== 1) { dx = 0; dy = -1; }
            }
        }, {passive: true});

        function resetStats() {
            if(confirm("Скинути весь прогрес?")) {
                localStorage.clear();
                highScore = 0; deaths = 0;
                updateStatsDisplay();
            }
        }
    </script>
</body>
</html>
